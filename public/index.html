<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zinkensdamm - Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* Departures slide-out panel */
    .departures-panel {
      position: absolute;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      border-left: 1px solid #333;
      z-index: 1000;
      overflow-y: auto;
      transition: right 0.3s ease;
    }

    .departures-panel.open {
      right: 0;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.95);
    }

    .panel-header h1 {
      font-size: 28px;
      margin: 0;
      font-weight: 300;
      letter-spacing: -0.5px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: #666;
      color: #fff;
    }

    .refresh-btn:active {
      background: #333;
    }

    .refresh-btn.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Overlay backdrop when panel is open */
    .panel-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Peek bar - always visible on right edge */
    .peek-bar {
      position: absolute;
      top: 80px;
      right: 0;
      width: 56px;
      bottom: 80px;
      background: rgba(0, 0, 0, 0.75);
      border-left: 1px solid #333;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
      z-index: 998;
      display: flex;
      flex-direction: column;
      padding: 10px 6px;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }

    .peek-bar:hover {
      background: rgba(0, 0, 0, 0.85);
      width: 62px;
    }

    .peek-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .peek-line {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      min-width: 32px;
      text-align: center;
    }

    .peek-time {
      font-size: 11px;
      font-weight: 600;
      color: #ffdd00;
    }

    .peek-divider {
      height: 1px;
      background: #333;
      margin: 2px 0;
    }

    .peek-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel-content {
      padding: 15px;
    }

    .mode-section {
      margin-bottom: 15px;
    }

    .mode-section:last-child {
      margin-bottom: 0;
    }

    .mode-title {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .departure-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 6px;
      border-left: 3px solid #333;
    }

    .departure-item:last-child {
      margin-bottom: 0;
    }

    .line-badge {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background: #333;
      padding: 4px 10px;
      border-radius: 4px;
      margin-right: 12px;
      min-width: 36px;
      text-align: center;
    }

    .departure-dest {
      flex: 1;
      font-size: 15px;
      color: #ddd;
    }

    .departure-time {
      font-size: 16px;
      font-weight: 600;
      color: #ffdd00;
      font-variant-numeric: tabular-nums;
    }

    /* Status bar */
    .status-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 1000;
    }

    .status-bar.error {
      color: #ff4444;
      border: 1px solid #ff4444;
    }

    .mode-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .mode-indicator.rush { background: #22c55e; }
    .mode-indicator.day { background: #3b82f6; }
    .mode-indicator.night { background: #6b7280; }

    /* Vehicle markers */
    .vehicle-marker {
      background: none;
      border: none;
    }

    /* Floating line number - no box, just text with shadow */
    .vehicle-label {
      position: absolute;
      font-size: 22px;
      font-weight: 800;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        0 0 8px rgba(0,0,0,0.8);
      white-space: nowrap;
      font-family: "Helvetica Neue", sans-serif;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      border-radius: 12px;
      border: 1px solid #444;
    }

    .leaflet-popup-tip {
      background: rgba(0, 0, 0, 0.9);
    }

    .leaflet-popup-content {
      margin: 14px;
    }

    .popup-line {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .popup-info {
      font-size: 14px;
      color: #888;
    }

    /* Leaflet zoom controls */
    .leaflet-control-zoom {
      border: none !important;
    }

    .leaflet-control-zoom a {
      background: rgba(0, 0, 0, 0.8) !important;
      color: #fff !important;
      border: 1px solid #333 !important;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Peek bar - always visible preview, click to toggle panel -->
  <div class="peek-bar" id="peekBar" onclick="togglePanel()">
    <!-- Populated by JS -->
  </div>

  <!-- Backdrop for closing panel -->
  <div class="panel-backdrop" id="panelBackdrop" onclick="togglePanel()"></div>

  <!-- Slide-out departures panel -->
  <div class="departures-panel" id="departuresPanel">
    <div class="panel-header">
      <h1>Zinkensdamm</h1>
      <button class="refresh-btn" id="refreshBtn" onclick="forceRefresh()">Refresh</button>
    </div>
    <div class="panel-content" id="departures">
      Loading departures...
    </div>
  </div>

  <div id="status" class="status-bar">Loading...</div>

  <script>
    // ==================== MODE CONFIGURATION ====================
    var MODES = {
      rush: {
        name: 'Rush Hour',
        bounds: 'sodermalm',
        center: [59.315, 18.06],
        zoom: 15,
        pollInterval: 30000  // 30 seconds
      },
      day: {
        name: 'Daytime',
        bounds: 'stockholm',
        center: [59.325, 18.07],
        zoom: 14,
        pollInterval: 60000  // 60 seconds
      },
      night: {
        name: 'Night',
        bounds: 'stockholm',
        center: [59.325, 18.07],
        zoom: 14,
        pollInterval: 600000  // 10 minutes
      }
    };

    function getCurrentMode() {
      var hour = new Date().getHours();
      if (hour >= 7 && hour < 9) return 'rush';
      if (hour >= 9 && hour < 23) return 'day';
      return 'night';
    }

    var currentMode = getCurrentMode();
    var lastMode = currentMode;

    // ==================== MAP SETUP ====================
    var config = MODES[currentMode];
    var map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView(config.center, config.zoom);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    var markers = {};

    function getVehicleColor(line) {
      var lineNum = parseInt(line);
      if (lineNum >= 10 && lineNum <= 19) {
        if (lineNum >= 17 && lineNum <= 19) return '#0089ca';
        if (lineNum >= 13 && lineNum <= 14) return '#dc2626';
        return '#4caf50';
      }
      if (lineNum >= 1 && lineNum <= 9) return '#2563eb';
      if (!isNaN(lineNum)) return '#dc2626';
      return '#888888';
    }

    // Bigger marker with floating line number (no box)
    function createVehicleIcon(line, bearing) {
      var color = getVehicleColor(line);
      var rotation = bearing || 0;

      var html = '<div style="position: relative; width: 44px; height: 44px;">' +
        // Floating label above - just text with shadow, no box
        '<div class="vehicle-label" style="position: absolute; top: -32px; left: 50%; transform: translateX(-50%); color: ' + color + ';">' + line + '</div>' +
        // Arrow/circle marker
        '<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">' +
        '<g transform="rotate(' + rotation + ' 22 22)">' +
        '<circle cx="22" cy="22" r="16" fill="' + color + '" stroke="#000" stroke-width="3"/>' +
        '<circle cx="22" cy="22" r="16" fill="none" stroke="#fff" stroke-width="2"/>' +
        '<polygon points="22,8 29,26 22,20 15,26" fill="#fff"/>' +
        '</g>' +
        '</svg>' +
        '</div>';

      return L.divIcon({
        className: 'vehicle-marker',
        html: html,
        iconSize: [44, 44],
        iconAnchor: [22, 22],
        popupAnchor: [0, -30]
      });
    }

    // ==================== VEHICLE UPDATES ====================
    function updateVehicles() {
      var mode = MODES[currentMode];
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/vehicles?bounds=' + mode.bounds, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          var statusEl = document.getElementById('status');
          if (xhr.status === 200) {
            try {
              var vehicles = JSON.parse(xhr.responseText);

              if (vehicles.error) {
                statusEl.innerHTML = '<span class="mode-indicator ' + currentMode + '"></span>' + vehicles.error;
                statusEl.className = 'status-bar error';
                return;
              }

              var timestamp = new Date().toLocaleTimeString('sv-SE', {
                hour: '2-digit',
                minute: '2-digit'
              });

              var seenIds = {};

              // Filter to only show lines that pass through Zinkensdamm
              var filteredVehicles = vehicles.filter(function(v) {
                return zinkensdammLines.has(v.line) || zinkensdammLines.size === 0;
              });

              var modeLabel = MODES[currentMode].name;
              var interval = MODES[currentMode].pollInterval / 1000;
              statusEl.innerHTML = '<span class="mode-indicator ' + currentMode + '"></span>' +
                filteredVehicles.length + ' vehicles | ' + modeLabel + ' (' + interval + 's) | ' + timestamp;
              statusEl.className = 'status-bar';

              filteredVehicles.forEach(function (v) {
                seenIds[v.id] = true;

                if (markers[v.id]) {
                  markers[v.id].setLatLng([v.lat, v.lng]);
                  markers[v.id].setIcon(createVehicleIcon(v.line, v.bearing));
                } else {
                  var marker = L.marker([v.lat, v.lng], {
                    icon: createVehicleIcon(v.line, v.bearing)
                  });

                  var speedKmh = v.speed ? Math.round(v.speed * 3.6) : 0;
                  marker.bindPopup(
                    '<div class="popup-line">Line ' + v.line + '</div>' +
                    '<div class="popup-info">Speed: ' + speedKmh + ' km/h</div>'
                  );

                  marker.addTo(map);
                  markers[v.id] = marker;
                }
              });

              for (var id in markers) {
                if (!seenIds[id]) {
                  map.removeLayer(markers[id]);
                  delete markers[id];
                }
              }

            } catch (e) {
              statusEl.innerHTML = '<span class="mode-indicator ' + currentMode + '"></span>Error: ' + e.message;
              statusEl.className = 'status-bar error';
            }
          }
        }
      };
      xhr.send();
    }

    // ==================== DEPARTURES ====================
    var MAX_DEPARTURES_PER_MODE = 4;
    // Lines that serve Zinkensdamm (fallback if departures don't load)
    var zinkensdammLines = new Set(['13', '14', '4', '66', '74', '96']);

    function updateDepartures() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/departures', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);

            // Extract lines that serve Zinkensdamm
            zinkensdammLines.clear();
            if (data.departures) {
              data.departures.forEach(function(dep) {
                zinkensdammLines.add(dep.line.designation);
              });
            }

            renderDepartures(data);
            updatePeekBar(data);
          } catch (e) {
            document.getElementById('departures').innerHTML = '<div style="color:#ff4444">Error loading</div>';
          }
        }
      };
      xhr.send();
    }

    function renderDepartures(data) {
      var container = document.getElementById('departures');

      if (!data.departures || data.departures.length === 0) {
        container.innerHTML = '<div style="color:#666;padding:20px;">No departures</div>';
        return;
      }

      var now = new Date();
      var filtered = data.departures.filter(function (dep) {
        var expected = new Date(dep.expected);
        var diff = (expected - now) / (1000 * 60);
        return diff >= 5;
      });

      var groups = {};
      var modeOrder = ['METRO', 'BUS', 'TRAIN', 'TRAM'];
      var modeNames = {
        'METRO': 'Tunnelbana',
        'BUS': 'Buss',
        'TRAIN': 'Pendeltåg',
        'TRAM': 'Spårvagn'
      };

      filtered.forEach(function (dep) {
        var mode = dep.line.transport_mode;
        if (!groups[mode]) groups[mode] = [];
        groups[mode].push(dep);
      });

      var html = '';

      modeOrder.forEach(function (mode) {
        var deps = groups[mode];
        if (!deps || deps.length === 0) return;

        var topDeps = deps.slice(0, MAX_DEPARTURES_PER_MODE);

        html += '<div class="mode-section">';
        html += '<div class="mode-title">' + (modeNames[mode] || mode) + '</div>';

        topDeps.forEach(function (dep) {
          var color = getLineColor(mode, dep.line.designation);
          html += '<div class="departure-item" style="border-left-color:' + color + '">';
          html += '<span class="line-badge" style="background:' + color + '">' + dep.line.designation + '</span>';
          html += '<span class="departure-dest">' + dep.destination + '</span>';
          html += '<span class="departure-time">' + dep.display + '</span>';
          html += '</div>';
        });

        html += '</div>';
      });

      container.innerHTML = html || '<div style="color:#666;padding:20px;">No departures >5 min</div>';
    }

    function getLineColor(mode, designation) {
      if (mode === 'METRO') return '#dc2626';
      if (mode === 'BUS') {
        var num = parseInt(designation);
        if (!isNaN(num) && num < 10) return '#2563eb';
        return '#dc2626';
      }
      if (mode === 'TRAIN') return '#33a1fd';
      return '#666';
    }

    // ==================== PEEK BAR ====================
    var peekBarData = [];

    function updatePeekBar(data) {
      var peekBar = document.getElementById('peekBar');

      if (!data || !data.departures || data.departures.length === 0) {
        peekBar.innerHTML = '<div style="color:#666;font-size:10px;text-align:center;">No data</div>';
        return;
      }

      var now = new Date();
      var filtered = data.departures.filter(function (dep) {
        var expected = new Date(dep.expected);
        var diff = (expected - now) / (1000 * 60);
        return diff >= 5;
      });

      // Take first 6 departures across all modes
      var top = filtered.slice(0, 6);

      var html = '';
      top.forEach(function(dep, i) {
        var color = getLineColor(dep.line.transport_mode, dep.line.designation);
        html += '<div class="peek-item">';
        html += '<span class="peek-line" style="background:' + color + '">' + dep.line.designation + '</span>';
        html += '<span class="peek-time">' + dep.display + '</span>';
        html += '</div>';
        if (i < top.length - 1) {
          html += '<div class="peek-divider"></div>';
        }
      });

      peekBar.innerHTML = html;
    }

    // ==================== PANEL TOGGLE ====================
    var panelOpen = false;

    function togglePanel() {
      panelOpen = !panelOpen;
      document.getElementById('departuresPanel').classList.toggle('open', panelOpen);
      document.getElementById('panelBackdrop').classList.toggle('open', panelOpen);
      document.getElementById('peekBar').classList.toggle('hidden', panelOpen);
    }

    // ==================== FORCE REFRESH ====================
    function forceRefresh() {
      var btn = document.getElementById('refreshBtn');
      btn.classList.add('loading');
      btn.textContent = '...';

      updateVehicles();
      updateDepartures();

      setTimeout(function() {
        btn.classList.remove('loading');
        btn.textContent = 'Refresh';
      }, 1000);
    }

    // ==================== MODE SWITCHING ====================
    function checkModeChange() {
      var newMode = getCurrentMode();
      if (newMode !== currentMode) {
        currentMode = newMode;
        var config = MODES[currentMode];

        // Clear all markers when switching modes
        for (var id in markers) {
          map.removeLayer(markers[id]);
        }
        markers = {};

        // Animate to new view
        map.flyTo(config.center, config.zoom, { duration: 1.5 });

        // Update immediately
        updateVehicles();

        console.log('Switched to mode:', currentMode);
      }
    }

    // ==================== ADAPTIVE POLLING ====================
    var pollTimer = null;

    function scheduleNextPoll() {
      if (pollTimer) clearTimeout(pollTimer);

      var interval = MODES[currentMode].pollInterval;
      pollTimer = setTimeout(function() {
        checkModeChange();
        updateVehicles();
        scheduleNextPoll();
      }, interval);
    }

    // ==================== INIT ====================
    updateVehicles();
    updateDepartures();
    scheduleNextPoll();

    // Check mode every minute
    setInterval(checkModeChange, 60000);

    // Update departures every 30 seconds
    setInterval(updateDepartures, 30000);
  </script>
</body>

</html>
